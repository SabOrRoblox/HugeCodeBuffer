name: Build & Sign APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  KEYSTORE_PASSWORD: 'release123'
  KEY_ALIAS: 'release'
  KEY_PASSWORD: 'release123'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with error output
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee build.log
        continue-on-error: true

      - name: Show Kotlin errors
        if: failure()
        run: |
          echo "=== KOTLIN ERRORS ==="
          grep -A 3 "e: " build.log || echo "No Kotlin errors found"
          echo "=== FULL ERROR ==="
          grep -B 2 -A 10 "FAILED" build.log || echo "No failed tasks"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ runner.temp }}/release.keystore \
            -alias ${{ env.KEY_ALIAS }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ env.KEYSTORE_PASSWORD }} \
            -keypass ${{ env.KEY_PASSWORD }} \
            -dname "CN=Local System, OU=System, O=System, L=City, S=State, C=US" \
            -noprompt

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ runner.temp }}/release.keystore \
            -Pandroid.injected.signing.store.password=${{ env.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ env.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ env.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: local-system
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
